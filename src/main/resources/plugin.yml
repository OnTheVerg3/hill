name: Hill
version: '${project.version}'
main: com.ontheverg3.hill.HillPlugin
api-version: '1.21.11'
folia-supported: true
author: OnTheVerg3
description: Folia King of the Hill (Blue vs Yellow)
website: https://github.com/OnTheVerg3/hill
prefix: Hill
softdepend:
  - PlaceholderAPI

permissions:
  hill.status:
    description: View a hill's control and the global scores
    default: true
  hill.help:
    description: View the command list or /hill help <command>
    default: op
  hill.reload:
    description: Reload config, language, and hills.json
    default: op
  hill.mode:
    description: Switch KotH or CTF mode
    default: op
  hill.new:
    description: Create a hill
    default: op
  hill.remove:
    description: Remove a hill
    default: op
  hill.assign:
    description: Assign players to Blue or Yellow
    default: op
  hill.unassign:
    description: Remove players from a team
    default: op
  hill.swapteams:
    description: Swap Blue and Yellow assignments
    default: op
  hill.swapscore:
    description: Swap Blue and Yellow scores
    default: op
  hill.pause:
    description: Pause scoring on a hill
    default: op
  hill.resume:
    description: Resume scoring on a hill
    default: op
  hill.reset:
    description: Reset the global scores
    default: op
  hill.perf:
    description: View occupancy sample timing
    default: op
  hill.autodivide:
    description: Shuffle-split online players by percent
    default: op
  hill.score:
    description: Add or remove global team score
    default: op
  hill.bossbar:
    description: Show or hide the score boss bar for everyone
    default: op
  hill.pad:
    description: Create or remove team assign pads
    default: op
  hill.admin:
    description: All Hill commands
    default: op
    children:
      hill.status: true
      hill.help: true
      hill.reload: true
      hill.mode: true
      hill.new: true
      hill.remove: true
      hill.assign: true
      hill.unassign: true
      hill.swapteams: true
      hill.swapscore: true
      hill.pause: true
      hill.resume: true
      hill.reset: true
      hill.perf: true
      hill.autodivide: true
      hill.score: true
      hill.bossbar: true
      hill.pad: true
