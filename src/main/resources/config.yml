# Hill config. Bad values keep the last good config on reload.

locale: en

scoring:
  interval-seconds: 5
  points: 1
  # 0 = no cap
  win-score: 0

# Who can score while standing in a hill.
eligibility:
  exclude-dead: true
  exclude-gamemodes:
    - SPECTATOR

# /hill assign (unless you name a player or the selector already filters gamemode/dead)
# and /hill autodivide (always).
assign:
  exclude-dead: true
  exclude-gamemodes:
    - SPECTATOR
    - CREATIVE

# Names and colors players see. Scoring still uses the two internal slots (blue / yellow in data.yml).
# Colors: Minecraft names (blue, gold, dark_aqua, light_purple, ...) or hex (#RGB, #RRGGBB, RRGGBB).
team1-displayname: Blue
team1-color: blue
team2-displayname: Yellow
team2-color: yellow

display:
  action-bar: true
  # Split score bar. true/on follows display.scores. always keeps it visible everywhere. false hides it. /hill bossbar writes this.
  boss-bar: true
  boss-bar-width: 24
  # always = scores HUD everywhere. in-zone = only while standing in a hill.
  scores: in-zone
  update-ticks: 20
  # Skip HUD for players with no client connection (some NPCs).
  skip-without-address: true
  # Skip HUD when the player name starts with this (empty = off).
  ignore-name-prefix: ""

outline:
  enabled: true
  interval-ticks: 10
  points: 72

reset:
  clear-teams: false

reload-resets: false
